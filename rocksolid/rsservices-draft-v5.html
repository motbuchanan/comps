function initDiagnostic(){
  var root=$("#site .m-checker");
  if(!root) return;
  function q(n){ return root.querySelector('[data-d="'+n+'"]'); }
  var chips="";
  for (var k=0;k<SYMPTOMS.length;k++){
    chips += '<button class="dchip2" type="button" data-idx="'+k+'" aria-pressed="false">'+esc(SYMPTOMS[k].label)+'</button>';
  }
  q("chips").innerHTML = chips;
  var sysdiag=q("sysdiag"), parts=root.querySelectorAll(".part"),
      needle2=q("needle2"), seep=q("seep"), trace=q("trace"), waterUp=q("water-up"),
      statusEl=q("status"), statusText=q("status-text"), smsBtn=root.querySelector(".ctxt"),
      chipEls=root.querySelectorAll(".dchip2");
  function setNeedle(sym){ var ang=(typeof sym.gauge==="number")?sym.gauge:0; needle2.style.transform="rotate("+ang+"deg)"; }
  function runTrace(){ trace.classList.remove("run"); void trace.getBoundingClientRect(); trace.classList.add("run"); }
  function setRow(n,val){ var el=q(n); var row=el.parentNode; if(val){ el.textContent=val; row.style.display="flex"; } else { row.style.display="none"; } }
  for (var c=0;c<chipEls.length;c++){
    chipEls[c].addEventListener("click", function(){
      var idx=parseInt(this.getAttribute("data-idx"),10); var sym=SYMPTOMS[idx];
      for (var j=0;j<chipEls.length;j++) chipEls[j].setAttribute("aria-pressed","false");
      this.setAttribute("aria-pressed","true");
      statusEl.className="status busy"; statusText.textContent="Tracing the system\u2026";
      runTrace();
      for (var p=0;p<parts.length;p++){
        var pn=parts[p].getAttribute("data-part");
        parts[p].classList.remove("active","dim");
        if (sym.part==="all"){}
        else if (pn===sym.part){ parts[p].classList.add("active"); }
        else { parts[p].classList.add("dim"); }
      }
      sysdiag.classList.toggle("paused", sym.flow==="stop");
      waterUp.classList.toggle("murky", !!sym.clean);
      seep.classList.toggle("on", !!sym.seep);
      setNeedle(sym);
      if(smsBtn){ smsBtn.setAttribute("href","sms:5672840833?body="+encodeURIComponent("Hi Paul \u2014 my water: "+sym.label)); }
      var self=sym;

    root.classList.remove("hr");
    pin.setAttribute("cx",co[0]); pin.setAttribute("cy",co[1]);
    r1.setAttribute("cx",co[0]); r1.setAttribute("cy",co[1]);
    r2.setAttribute("cx",co[0]); r2.setAttribute("cy",co[1]);
    cap.textContent = name==="Ashland" ? "Home base: Ashland" : (name+" \u2014 covered.");
  } else {
    root.classList.add("hr");
    cap.textContent="An hour past the lines \u2014 call, we probably still come.";
  }
}

/* ---------------- scroll engine: droplet + glass ---------------- */
var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var W={ok:false};
function layoutWater(){
  W.ok=false;
  var siteEl=$("#site");
  var bore=$(".sbore"), drop=$(".sdrop");
  if(state.theme!=="water"){ if(bore){bore.remove();} if(drop){drop.remove();} return; }
  if(!bore){ bore=document.createElement("div"); bore.className="sbore"; siteEl.appendChild(bore); }
  if(!drop){ drop=document.createElement("div"); drop.className="sdrop"; siteEl.appendChild(drop); }
  var scene=$("#site .scene"), aq=$("#site .aqband");
  if(!scene){ bore.style.display="none"; drop.style.display="none"; return; }
  var siteTop=siteEl.getBoundingClientRect().top + window.pageYOffset;
  var scR=scene.getBoundingClientRect();
  var startY=(scR.top+window.pageYOffset-siteTop)+scR.height-52; // from wellhead
  var endY;
  if(aq){ var aR=aq.getBoundingClientRect(); endY=(aR.top+window.pageYOffset-siteTop)+16; }
  else { var sv=$("#site .m-services"); if(!sv){ bore.style.display="none"; drop.style.display="none"; return; }
    var vR=sv.getBoundingClientRect(); endY=(vR.top+window.pageYOffset-siteTop)+vR.height-40; }
  bore.style.top=startY+"px"; bore.style.height=(endY-startY)+"px"; bore.style.display="";
  W.ok=true; W.startY=startY; W.endY=endY; W.siteTop=siteTop; W.drop=drop;
  if(REDUCE){ drop.style.display="none"; }
}
var DROP={t0:null, plinked:false, CYCLE:8200, FALL:6600};
function dropletFrame(ts){
  if(W.ok && !REDUCE){
    if(DROP.t0===null) DROP.t0=ts;
    var t=(ts-DROP.t0)%DROP.CYCLE;
    var drop=W.drop;
    if(t<=DROP.FALL){
      if(t<80){ if(!DROP.remeasured){ DROP.remeasured=true; layoutWater(); } DROP.plinked=false; }
      else { DROP.remeasured=false; }
      var p=t/DROP.FALL; p=p*p*0.55+p*0.45;   // slight ease-in, still steady
      drop.style.opacity= t<300 ? String(t/300) : "1";
      drop.style.top=(W.startY + p*(W.endY-W.startY))+"px";
    } else {
      drop.style.opacity="0";
      if(!DROP.plinked){ DROP.plinked=true; spawnPlink(); }
    }
  }
  requestAnimationFrame(dropletFrame);
}
function spawnPlink(){
  var siteEl=$("#site"); if(!siteEl||!W.ok) return;
  var pl=document.createElement("div");
  pl.className="plink"; pl.style.top=(W.endY)+"px";
  pl.innerHTML='<span class="ring"></span><span class="ring r2"></span>'
    +'<span class="sp s1" style="--sx:-9px"></span><span class="sp s2" style="--sx:8px"></span>'
    +'<span class="sp s3" style="--sx:0px"></span>';
  siteEl.appendChild(pl);
  var aq=$("#site .aqband");
  if(aq){ aq.classList.add("hit"); setTimeout(function(){ aq.classList.remove("hit"); }, 500); }
  setTimeout(function(){ if(pl.parentNode) pl.parentNode.removeChild(pl); }, 950);
}
requestAnimationFrame(dropletFrame);
function onScrollGlass(){
  var j=$("#site .m-journey"); if(!j) return;
  var gw=j.querySelector(".gwater"); if(!gw) return;
  if(REDUCE){ gw.style.height="76%"; j.classList.add("full");
    var st0=j.querySelectorAll(".stop"); for(var a=0;a<st0.length;a++) st0[a].classList.add("lit"); return; }
  var r=j.getBoundingClientRect();
  var p=(window.innerHeight*0.9 - r.top)/(r.height + window.innerHeight*0.25);
  p=Math.max(0,Math.min(1,p*1.32));
  gw.style.height=(p*76)+"%";
  j.classList.toggle("full", p>=0.99);
  var stops=j.querySelectorAll(".stop");
  for(var i=0;i<stops.length;i++){ stops[i].classList.toggle("lit", p>=(i+1)/(stops.length+0.4)); }
}
var ticking=false;
function onScrollAll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(function(){ onScrollGlass(); ticking=false; });
}
window.addEventListener("scroll", onScrollAll, {passive:true});
window.addEventListener("resize", function(){ layoutWater(); onScrollGlass(); });
window.addEventListener("load", function(){ setTimeout(function(){ layoutWater(); onScrollGlass(); }, 250); });

/* ---------------- render ---------------- */
function applyBodyClasses(){
  document.body.className="t-"+state.theme;
  for(var f in state.flares){ if(state.flares[f]) document.body.className+=" f-"+f; }
}
function renderSite(){
  var html="";
  for(var i=0;i<state.order.length;i++){
    var id=state.order[i];
    if(state.on[id]) html+=TPL[id]();
  }
  $("#site").innerHTML=html;
}
function renderBuild(){
  $$(".thcard").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-theme")===state.theme); });
  var fl=FLARES[state.theme], fh="";
  for(var i=0;i<fl.length;i++){
    fh+='<button class="fchip'+(state.flares[fl[i].id]?" on":"")+'" data-flare="'+fl[i].id+'">'+fl[i].n+'</button>';
  }
  $("#flares").innerHTML=fh;
  var ph="";
  for(var q2=0;q2<PHOTO_STYLES.length;q2++){
    ph+='<button class="fchip'+(state.photoStyle===PHOTO_STYLES[q2].id?" on":"")+'" data-pstyle="'+PHOTO_STYLES[q2].id+'">'+PHOTO_STYLES[q2].n+'</button>';
  }
  $("#pstyles").innerHTML=ph;
  var mh="";
  for(var j=0;j<state.order.length;j++){
    var m=null, id=state.order[j];
    for(var k=0;k<MODULES.length;k++){ if(MODULES[k].id===id){ m=MODULES[k]; break; } }
    if(!m) continue;
    var first=j===0, last=j===state.order.length-1;
    mh+='<div class="modrow">'
      +'<button class="mv" data-move="up" data-id="'+id+'"'+((first||m.locked)?" disabled":"")+'>&#9650;</button>'
      +'<button class="mv" data-move="dn" data-id="'+id+'"'+((last||m.locked)?" disabled":"")+'>&#9660;</button>'
      +'<span class="nm"><b>'+m.name+'</b><span>'+m.note+'</span></span>'
      +'<button class="sw'+(state.on[id]?" on":"")+(m.locked?" lock":"")+'" data-tgl="'+id+'" aria-label="toggle '+m.name+'"></button>'
      +'</div>';
  }
  $("#mods").innerHTML=mh;
}
function renderGallery(){
  var gh="";
  for(var i=0;i<MODULES.length;i++){
    var m=MODULES[i];
    gh+='<div class="acard"><div class="ah"><b>'+m.name+'</b>'
      +'<button class="sw'+(state.on[m.id]?" on":"")+(m.locked?" lock":"")+'" data-tgl="'+m.id+'"></button></div>'
      +'<div class="prev">'+TPL[m.id]()+'</div></div>';
  }
  $("#gallery").innerHTML=gh;
}
function renderAll(){ applyBodyClasses(); renderSite(); renderBuild(); renderGallery(); save();
  initDiagnostic(); startCine();
  setTimeout(function(){ layoutWater(); onScrollGlass(); }, 60);
}

/* ---------------- photo-style engines ---------------- */
var CINE={timer:null};
function startCine(){
  if(CINE.timer){ clearInterval(CINE.timer); CINE.timer=null; }
  var box=$("#site [data-cine]"); if(!box) return;
  var slides=box.querySelectorAll(".cslide"), cap=box.querySelector("[data-ccap]"),
      num=box.querySelector("[data-cnum]"), idx=0;
  CINE.timer=setInterval(function(){
    idx=(idx+1)%slides.length;
    for(var i=0;i<slides.length;i++) slides[i].classList.toggle("on", i===idx);
    cap.innerHTML=SHOTS[idx][1]; num.textContent=(idx+1)+" / "+slides.length;
  }, 4600);
}
function xrMove(e){
  var xr=e.target.closest ? e.target.closest(".xr") : null;
  if(!xr) return;
  var r=xr.getBoundingClientRect();
  var x=Math.max(0,Math.min(100,((e.clientX-r.left)/r.width)*100));
  var y=Math.max(0,Math.min(100,((e.clientY-r.top)/r.height)*100));
  var top=xr.querySelector(".xtop");
  top.style.setProperty("--cx", x+"%");
  top.style.setProperty("--cy", y+"%");
}
document.addEventListener("pointerdown", xrMove, {passive:true});
document.addEventListener("pointermove", function(e){ if(e.buttons||e.pointerType==="touch") xrMove(e); }, {passive:true});
document.addEventListener("input", function(e){
  var w=e.target.closest ? e.target.closest(".wipe") : null;
  if(!w || e.target.type!=="range") return;
  var v=e.target.value;
  w.querySelector(".bef").style.width=v+"%";
  w.querySelector(".wbar").style.left=v+"%";
});

/* ---------------- interactions ---------------- */
document.addEventListener("click", function(e){
  var t=e.target.closest ? e.target.closest("button, .sc, [data-deck], .pin2") : null;
  if(!t) return;
  if(t.id==="openDrawer"){ $("#drawer").classList.add("openD"); return; }
  if(t.id==="closeDrawer"){ $("#drawer").classList.remove("openD"); return; }
  if(t.classList.contains("dtab")){
    $$(".dtab").forEach(function(x){x.classList.remove("on");}); t.classList.add("on");
    $$(".dpane").forEach(function(x){x.classList.remove("on");});
    $("#pane-"+t.getAttribute("data-pane")).classList.add("on");
    return;
  }
  var th=t.getAttribute("data-theme");
  if(th){ state.theme=th; renderAll(); return; }
  var fl=t.getAttribute("data-flare");
  if(fl){ state.flares[fl]=!state.flares[fl]; renderAll(); return; }
  var tg=t.getAttribute("data-tgl");
  if(tg){ state.on[tg]=!state.on[tg]; renderAll(); return; }
  var mv=t.getAttribute("data-move");
  if(mv){
    var id=t.getAttribute("data-id"), idx=state.order.indexOf(id);
    var ni=mv==="up"?idx-1:idx+1;
    if(ni<=0||ni>=state.order.length-1){ if(!(ni===0&&mv==="up")&&!(ni===state.order.length-1&&mv==="dn")) return; }
    if(ni<0||ni>state.order.length-1) return;
    var other=state.order[ni];
    var oLocked=false;
    for(var k=0;k<MODULES.length;k++){ if(MODULES[k].id===other&&MODULES[k].locked){ oLocked=true; } }
    if(oLocked) return;
    state.order[idx]=other; state.order[ni]=id;
    renderAll(); return;
  }
  if(t.classList && t.classList.contains("pin2")){
    var was=t.classList.contains("show");
    var sibs=t.parentNode.querySelectorAll(".pin2");
    for(var sb=0;sb<sibs.length;sb++) sibs[sb].classList.remove("show");
    if(!was) t.classList.add("show");
    return;
  }
  var ps=t.getAttribute("data-pstyle");
  if(ps){ state.photoStyle=ps; renderAll(); return; }
  var ft=t.getAttribute("data-feat");
  if(ft!==null && ft!==undefined && ft!==""){
    var host=t.closest(".m-photos"), fi=parseInt(ft,10);
    var box=host.querySelector("[data-featbox] img"); box.src="rss-job-"+(fi+1)+".jpg"; box.alt=SHOTS[fi][0];
    host.querySelector("[data-featcap]").innerHTML=SHOTS[fi][1];
    host.querySelector("[data-feattag]").innerHTML=SHOTS[fi][2];
    var ths=host.querySelectorAll(".fthumb");
    for(var y=0;y<ths.length;y++) ths[y].classList.remove("on");
    t.classList.add("on"); return;
  }
  if(t.hasAttribute("data-deck") || (t.closest && t.closest("[data-deck]"))){
    var card=t.hasAttribute("data-deck")?t:t.closest("[data-deck]");
    var dk=card.parentNode;
    card.classList.add("away");
    setTimeout(function(){
      card.classList.remove("away");
      var minZ=99; var cards=dk.querySelectorAll(".dcard");
      for(var z=0;z<cards.length;z++){ minZ=Math.min(minZ, parseInt(cards[z].style.zIndex||1,10)); }
      card.style.zIndex=(minZ-1);
    }, 260);
    return;
  }
  var pgd=t.getAttribute("data-pg");
  if(pgd){
    var pbox=t.closest("[data-pgbox]");
    var pi=(parseInt(pbox.getAttribute("data-pgi"),10)+parseInt(pgd,10)+6)%6;
    pbox.setAttribute("data-pgi", pi);
    var im=pbox.querySelector(".pgimg img"); im.src="rss-job-"+(pi+1)+".jpg"; im.alt=SHOTS[pi][0];
    pbox.querySelector("[data-pgcap]").innerHTML=SHOTS[pi][1];
    pbox.querySelector("[data-pgn]").innerHTML=(pi+1)+" of 6 &middot; "+SHOTS[pi][2];
    return;
  }
  var tw=t.getAttribute("data-town");
  if(tw){ pickTown(tw, t); return; }
  if(t.id==="copyPicks"){
    var names={}, i;
    for(i=0;i<MODULES.length;i++){ names[MODULES[i].id]=MODULES[i].name; }
    var lines=["RS SERVICES \u2014 PAUL'S PICKS","Look: "+(state.theme==="water"?"Water Table":"The Rig"),"Sections in order:"];
    for(i=0;i<state.order.length;i++){
      var id2=state.order[i];
      lines.push("  "+(i+1)+". "+names[id2]+(state.on[id2]?"":"  (OFF)"));
    }
    var fls=FLARES[state.theme], fparts=[];
    for(i=0;i<fls.length;i++){ fparts.push(fls[i].n+": "+(state.flares[fls[i].id]?"on":"off")); }
    lines.push("Flare: "+fparts.join(", "));
    var txt=lines.join("\n");
    function done(){ var to=$("#toast"); to.classList.add("show"); setTimeout(function(){to.classList.remove("show");},1800); }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done();});
    } else { fallback(txt); done(); }
    function fallback(s){ var ta=document.createElement("textarea"); ta.value=s; document.body.appendChild(ta);
      ta.select(); try{document.execCommand("copy");}catch(err){} document.body.removeChild(ta); }
    return;
  }
});

renderAll();
</script>
